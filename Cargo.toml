[package]
name = "cndb"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bson = "2.8"
bincode = "1.3"
thiserror = "1.0"
crc32fast = "1.4"
console = { version = "0.16", features = ["std"] }

# Vector search (rust-bert, hnsw) is deferred to v1 — see docs/ARCHITECTURE.md
# §1.3. rust-bert pulls torch-sys, which needs a libtorch install at build time
# and rules out the single portable binary the project depends on. The v1
# replacement is a statically linked ONNX/Candle backend.

[dev-dependencies]
criterion = "0.5"
crc32fast = "1.4"
tempfile = "3.8"
